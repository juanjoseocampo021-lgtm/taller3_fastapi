<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ficha de Avalúo · Tasador de Viviendas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f6f1e7;
            --card: #fffdf8;
            --ink: #1c2b3a;
            --ink-soft: #4a5a68;
            --line: #c9beac;
            --gold: #a8781f;
            --gold-dark: #8a611a;
            --terracotta: #9c4a3a;
            --terracotta-bg: #f7ece9;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Source Serif 4", Georgia, serif;
            background: var(--paper);
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 28px 28px;
            background-position: -1px -1px;
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 64px 16px;
            margin: 0;
        }
        .sheet {
            background: var(--card);
            border: 1px solid var(--ink);
            max-width: 440px;
            width: 100%;
            box-shadow: 6px 6px 0 rgba(28, 43, 58, 0.08);
        }
        .sheet-head {
            padding: 28px 32px 20px;
            border-bottom: 1px solid var(--line);
        }
        .kicker {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.72rem;
            letter-spacing: 0.02em;
            color: var(--gold-dark);
            margin: 0 0 10px;
        }
        h1 {
            font-size: 1.65rem;
            font-weight: 600;
            margin: 0;
            line-height: 1.3;
            color: var(--ink);
        }
        .sketch {
            padding: 22px 32px 4px;
            display: flex;
            justify-content: center;
        }
        .sketch svg { width: 100%; max-width: 260px; height: auto; }
        .sheet-body { padding: 20px 32px 32px; }
        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        label {
            font-size: 0.95rem;
            color: var(--ink-soft);
        }
        .field-unit {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.75rem;
            color: var(--ink-soft);
        }
        .input-line {
            border-bottom: 2px solid var(--ink);
            margin-bottom: 26px;
        }
        input[type="number"] {
            width: 100%;
            border: none;
            background: transparent;
            padding: 6px 2px 10px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 1.4rem;
            color: var(--ink);
        }
        input[type="number"]:focus { outline: none; }
        input[type="number"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
        input::placeholder { color: #a9a196; }

        button {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        button:hover { background: var(--gold-dark); border-color: var(--gold-dark); }
        button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

        .resultado {
            margin-top: 26px;
            border: 1px solid var(--gold);
            position: relative;
            padding: 18px 20px 20px;
        }
        .resultado::before {
            content: "AVALÚO";
            position: absolute;
            top: -10px;
            left: 16px;
            background: var(--card);
            padding: 0 8px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            color: var(--gold-dark);
        }
        .resultado .linea {
            display: flex;
            justify-content: space-between;
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.85rem;
            color: var(--ink-soft);
            padding: 6px 0;
            border-bottom: 1px dashed var(--line);
        }
        .resultado .linea:last-of-type { border-bottom: none; }
        .resultado .valor {
            color: var(--ink);
            font-weight: 500;
        }
        .resultado .precio-total {
            margin-top: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--ink);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .resultado .precio-total .label { font-size: 0.85rem; color: var(--ink-soft); }
        .resultado .precio-total .monto {
            font-family: "IBM Plex Mono", monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gold-dark);
        }

        .error {
            margin-top: 26px;
            padding: 14px 18px;
            border-left: 3px solid var(--terracotta);
            background: var(--terracotta-bg);
            color: var(--terracotta);
            font-size: 0.92rem;
            line-height: 1.45;
        }

        @media (prefers-reduced-motion: reduce) {
            button { transition: none; }
        }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="sheet-head">
            <p class="kicker">FICHA N.º 001 — MODELO DE REGRESIÓN LINEAL</p>
            <h1>Tasador de Viviendas</h1>
        </div>

        <div class="sketch">
            <svg viewBox="0 0 240 130" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 70 L120 15 L220 70" stroke="#1c2b3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M32 62 V118 H208 V62" stroke="#1c2b3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="100" y="80" width="40" height="38" stroke="#1c2b3a" stroke-width="1.3"/>
                <line x1="120" y1="80" x2="120" y2="118" stroke="#1c2b3a" stroke-width="1"/>
                <rect x="52" y="76" width="24" height="20" stroke="#a8781f" stroke-width="1.2"/>
                <line x1="64" y1="76" x2="64" y2="96" stroke="#a8781f" stroke-width="0.8"/>
                <line x1="52" y1="86" x2="76" y2="86" stroke="#a8781f" stroke-width="0.8"/>
                <rect x="164" y="76" width="24" height="20" stroke="#a8781f" stroke-width="1.2"/>
                <line x1="176" y1="76" x2="176" y2="96" stroke="#a8781f" stroke-width="0.8"/>
                <line x1="164" y1="86" x2="188" y2="86" stroke="#a8781f" stroke-width="0.8"/>
                <line x1="32" y1="122" x2="208" y2="122" stroke="#c9beac" stroke-width="1" stroke-dasharray="2 3"/>
            </svg>
        </div>

        <div class="sheet-body">
            <form method="post">
                {% csrf_token %}
                <div class="field-row">
                    <label for="area_m2">Área de la vivienda</label>
                    <span class="field-unit">m²</span>
                </div>
                <div class="input-line">
                    <input
                        type="number"
                        id="area_m2"
                        name="area_m2"
                        step="0.1"
                        min="0.1"
                        placeholder="0.0"
                        value="{{ area_ingresada|default:'' }}"
                        required
                    >
                </div>
                <button type="submit">CALCULAR VALOR ESTIMADO</button>
            </form>

            {% if resultado %}
            <div class="resultado">
                <div class="linea">
                    <span>Área evaluada</span>
                    <span class="valor">{{ resultado.area_m2 }} m²</span>
                </div>
                <div class="precio-total">
                    <span class="label">Valor estimado</span>
                    <span class="monto">${{ resultado.predicted_price }}</span>
                </div>
            </div>
            {% endif %}

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
